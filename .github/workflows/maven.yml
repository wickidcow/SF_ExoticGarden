name: Build ExoticGarden Legacy 1.0.1

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

env:
  LEGACY_ARTIFACT_VERSION: "1.0.1"
  OUTPUT_NAME: "SF_ExoticGarden1.0.1.jar"

concurrency:
  group: exoticgarden-legacy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Prepare inherited source
        run: python3 scripts/prepare_legacy_1_1.py
      - name: Verify compatibility metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "api-version: '1.21.11'" src/main/resources/plugin.yml
          grep -Eq '^name:[[:space:]]*ExoticGarden[[:space:]]*$' src/main/resources/plugin.yml
          grep -Fq '<maven.compiler.release>21</maven.compiler.release>' pom.xml
          grep -Fq '<paper.version>1.21.11-R0.1-SNAPSHOT</paper.version>' pom.xml
          ! grep -Eq '^[[:space:]]*-[[:space:]]*(GuizhanLibPlugin|GuguSlimefunLib)[[:space:]]*$' src/main/resources/plugin.yml
      - name: Verify Paper 1.21.11 compile baseline
        run: mvn -B -ntp clean test -Dpaper.version=1.21.11-R0.1-SNAPSHOT
      - name: Verify Paper 26.2 compile compatibility
        run: mvn -B -ntp clean test -Dpaper.version=26.2.build.111-stable
      - name: Build universal release JAR from 1.21.11 baseline
        run: mvn -B -ntp clean package -Dpaper.version=1.21.11-R0.1-SNAPSHOT
      - name: Verify release metadata and Java 21 bytecode
        shell: bash
        run: |
          set -euo pipefail
          JAR="target/ExoticGarden-Legacy-1.0.1.jar"
          test -s "$JAR"
          unzip -p "$JAR" plugin.yml | grep -Fq "api-version: '1.21.11'"
          javap -verbose -classpath "$JAR" io.github.thebusybiscuit.exoticgarden.ExoticGarden | grep -Fq 'major version: 65'
      - name: Stage versioned JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          JAR="target/ExoticGarden-Legacy-1.0.1.jar"
          cp "$JAR" "dist/${OUTPUT_NAME}"
          sha256sum "dist/${OUTPUT_NAME}"
      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error
      - name: Publish raw JAR release asset
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v${LEGACY_ARTIFACT_VERSION}"; fi
          JAR="dist/${OUTPUT_NAME}"
          NOTES="Compatibility release: lowers the plugin API floor to Minecraft/Purpur 1.21.11, emits Java 21 bytecode, and verifies the same source against Paper 1.21.11 and Paper 26.2 while preserving Slimefun Legacy behavior."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --title "SF_ExoticGarden $TAG" --notes "$NOTES"
          fi
