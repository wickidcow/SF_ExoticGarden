name: Build ExoticGarden Legacy 1.1

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exoticgarden-legacy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ExoticGarden-Legacy-1.1.jar
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Prepare inherited source for Legacy 1.1
        run: python3 scripts/prepare_legacy_1_1.py

      - name: Verify Legacy 1.1 compatibility contract
        run: python3 scripts/verify_legacy_1_1.py

      - name: Build ExoticGarden Legacy 1.1
        run: mvn -B -ntp clean package

      - name: Re-run static verification after build
        run: python3 scripts/verify_legacy_1_1.py

      - name: Verify exact release JAR
        shell: bash
        run: |
          set -euo pipefail

          JAR="target/ExoticGarden-Legacy-1.1.jar"

          test -f "$JAR"
          test -s "$JAR"

          echo "Built:"
          ls -lh "$JAR"

          echo
          echo "SHA-256:"
          sha256sum "$JAR"

          echo
          echo "Embedded plugin.yml:"
          unzip -p "$JAR" plugin.yml

          echo
          echo "Checking that fork-specific libraries were not shaded..."
          if jar tf "$JAR" | grep -Eq \
            '^(net/guizhanss/|com/xzavier0722/mc/plugin/slimefun4/)'; then
            echo "ERROR: Fork-specific compatibility classes were bundled."
            exit 1
          fi

          echo "No Guizhan/Gugu implementation classes bundled."

      - name: Upload ExoticGarden-Legacy-1.1.jar
        uses: actions/upload-artifact@v7
        with:
          name: ExoticGarden-Legacy-1.1
          path: target/ExoticGarden-Legacy-1.1.jar
          if-no-files-found: error
          retention-days: 30
