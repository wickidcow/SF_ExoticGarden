name: Build ExoticGarden 1.0.3

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: "1.0.3"
  OUTPUT_NAME: "SF_ExoticGarden1.0.3.jar"

concurrency:
  group: exoticgarden-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify canonical release identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]
          test "$OUTPUT_NAME" = "SF_ExoticGarden${VERSION}.jar"
          test "$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" = "$VERSION"
          grep -Fq '<finalName>SF_ExoticGarden${project.version}</finalName>' pom.xml
          grep -Fq "api-version: '1.21.11'" src/main/resources/plugin.yml
      - name: Verify Paper 1.21.11 compile baseline
        run: mvn -B -ntp clean test -Dpaper.version=1.21.11-R0.1-SNAPSHOT
      - name: Restore inherited source before 26.2 compatibility build
        run: git checkout -- src/main/java
      - name: Verify Paper 26.2 compile compatibility
        run: mvn -B -ntp clean test "-Dpaper.version=[26.2.build,26.3)"
      - name: Restore inherited source before 26.3 compatibility build
        run: git checkout -- src/main/java
      - name: Verify Paper 26.3 alpha compile compatibility
        run: mvn -B -ntp clean test -Dpaper.version=26.3-rc-3.build.1-alpha
      - name: Restore inherited source before release build
        run: git checkout -- src/main/java
      - name: Build universal release JAR from 1.21.11 baseline
        run: mvn -B -ntp clean package -Dpaper.version=1.21.11-R0.1-SNAPSHOT
      - name: Verify and stage release JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="target/${OUTPUT_NAME}"
          test -s "$JAR"
          PLUGIN_VERSION=$(unzip -p "$JAR" plugin.yml | awk -F': *' '/^version:/ {gsub(/["'"'"']/,"",$2); print $2; exit}')
          test "$PLUGIN_VERSION" = "$VERSION"
          if printf '%s\n' "$PLUGIN_VERSION" | grep -Eiq '(legacy|english|snapshot)'; then exit 1; fi
          javap -verbose -classpath "$JAR" io.github.thebusybiscuit.exoticgarden.ExoticGarden | grep -Fq 'major version: 65'
          mkdir -p dist
          cp "$JAR" "dist/${OUTPUT_NAME}"
          sha256sum "dist/${OUTPUT_NAME}"
      - name: Upload canonical raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error
      - name: Publish canonical raw JAR release asset
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v${VERSION}"; fi
          JAR="dist/${OUTPUT_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            while IFS= read -r OLD; do
              if [[ "$OLD" == *.jar && "$OLD" != "$OUTPUT_NAME" ]]; then gh release delete-asset "$TAG" "$OLD" --repo "$GITHUB_REPOSITORY" -y; fi
            done < <(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            gh release upload "$TAG" "$JAR" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$JAR" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "SF_ExoticGarden ${VERSION}" --notes "ExoticGarden ${VERSION}: canonical ${OUTPUT_NAME} release."
          fi
