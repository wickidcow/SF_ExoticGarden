name: Build ExoticGarden Legacy

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exoticgarden-legacy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ExoticGarden-Legacy-1.0.jar
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Normalize inherited source for Paper 26.2
        run: python3 scripts/prepare_26_2_sources.py

      - name: Build ExoticGarden Legacy
        run: mvn -B -ntp clean package

      - name: Verify exact release JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="target/ExoticGarden-Legacy-1.0.jar"

          test -f "$JAR"
          test -s "$JAR"

          echo "Built:"
          ls -lh "$JAR"

          echo "SHA-256:"
          sha256sum "$JAR"

          echo "Checking plugin metadata..."
          unzip -p "$JAR" plugin.yml

      - name: Upload ExoticGarden-Legacy-1.0.jar
        uses: actions/upload-artifact@v7
        with:
          name: ExoticGarden-Legacy-1.0
          path: target/ExoticGarden-Legacy-1.0.jar
          if-no-files-found: error
          retention-days: 30
